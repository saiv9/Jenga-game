<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jenga 3D - Updated</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0c10;
      color: #ffffff;
    }

    #webgl-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .hidden {
      display: none !important;
    }

    /* Fullscreen Overlay Screens */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 50px 20px;
      background: radial-gradient(circle at center, rgba(15, 20, 28, 0.85) 0%, rgba(5, 7, 10, 0.95) 100%);
    }

    .glass-card {
      background: rgba(18, 24, 34, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    /* HUD Bar */
    #game-hud {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      pointer-events: none;
    }

    .hud-btn {
      pointer-events: auto;
      background: rgba(18, 24, 34, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-btn:hover {
      background: rgba(255, 157, 0, 0.2);
      border-color: #ff9d00;
      color: #ffaa2b;
      transform: translateY(-2px);
    }

    .turn-indicator {
      background: rgba(18, 24, 34, 0.9);
      backdrop-filter: blur(12px);
      border: 2px solid #ff9d00;
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(255, 157, 0, 0.3);
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(255, 157, 0, 0.3); }
      50% { box-shadow: 0 0 25px rgba(255, 157, 0, 0.6); }
    }

    /* Titles & Menus */
    .menu-title h1 {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 6px;
      color: #f3a640;
      text-shadow: 0 4px 20px rgba(243, 166, 64, 0.4);
      text-align: center;
    }

    .menu-title p {
      font-size: 13px;
      letter-spacing: 6px;
      color: #8a929a;
      text-align: center;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .menu-box {
      width: 100%;
      max-width: 360px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    .menu-box h2 {
      font-size: 16px;
      color: #dce2e8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .btn-main {
      width: 100%;
      max-width: 260px;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      background: linear-gradient(135deg, #ff9d00 0%, #e67e00 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(255, 157, 0, 0.4);
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .btn-main:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 30px rgba(255, 157, 0, 0.6);
    }

    .btn-option {
      width: 100%;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      color: #e0e6ed;
      background: rgba(32, 40, 52, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-option:hover {
      background: rgba(255, 157, 0, 0.2);
      border-color: #ff9d00;
      color: #ffaa2b;
      transform: translateX(2px);
    }

    /* Game Over Modal Screen */
    #game-over-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 200;
      background: rgba(5, 7, 10, 0.88);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-over-card {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .img-avatar-container {
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      filter: drop-shadow(0 8px 16px rgba(255, 157, 0, 0.3));
    }

    .img-avatar-container svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .taunt-message {
      font-size: 18px;
      font-weight: 800;
      color: #ff4d4d;
      line-height: 1.4;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(255, 77, 77, 0.3);
    }

    .game-details-box {
      width: 100%;
      background: rgba(12, 16, 22, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      color: #a0a8b0;
    }

    .detail-row span:last-child {
      color: #ffffff;
      font-weight: bold;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 6px;
    }

    .btn-action {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .btn-rematch {
      background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
    }

    .btn-rematch:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(40, 167, 69, 0.5);
    }

    .btn-menu {
      background: rgba(40, 48, 62, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e0e6ed;
    }

    .btn-menu:hover {
      background: rgba(60, 72, 90, 0.9);
      color: white;
      transform: translateY(-2px);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

  <div id="webgl-container"></div>

  <!-- HUD -->
  <div id="game-hud" class="hidden">
    <button class="hud-btn" onclick="backToMenu()">🏠 Home</button>
    <div class="turn-indicator" id="hud-turn-display">Player 1's Turn</div>
    <button class="hud-btn" onclick="undoMove()">↩ Reverse Move</button>
  </div>

  <!-- START MENU -->
  <div id="start-menu" class="overlay-screen">
    <div class="menu-title">
      <h1>JENGA</h1>
      <p>CHALLENGE 3D</p>
    </div>
    <button class="btn-main" onclick="goToModeMenu()">PLAY</button>
  </div>

  <!-- GAME MODE MENU -->
  <div id="mode-menu" class="overlay-screen hidden">
    <div class="menu-title">
      <h1>JENGA</h1>
      <p>SELECT GAME MODE</p>
    </div>
    <div class="menu-box glass-card">
      <h2>Game Mode</h2>
      <button class="btn-option" onclick="selectMode('vs_ai')">👤 Player vs AI</button>
      <button class="btn-option" onclick="selectMode('2p')">👥 2 Players</button>
      <button class="btn-option" onclick="selectMode('3p')">👨‍👦‍👦 3 Players</button>
    </div>
    <div></div>
  </div>

  <!-- AI DIFFICULTY MENU -->
  <div id="diff-menu" class="overlay-screen hidden">
    <div class="menu-title">
      <h1>DIFFICULTY</h1>
      <p>SELECT AI LEVEL</p>
    </div>
    <div class="menu-box glass-card">
      <h2>Difficulty</h2>
      <button class="btn-option" onclick="startGameWithDiff('easy')">🟢 Easy</button>
      <button class="btn-option" onclick="startGameWithDiff('intermediate')">🟡 Intermediate</button>
      <button class="btn-option" onclick="startGameWithDiff('hard')">🔴 Hard</button>
      <button class="btn-option" onclick="startGameWithDiff('impossible')">🔥 Impossible</button>
    </div>
    <div></div>
  </div>

  <!-- GAME OVER SCREEN -->
  <div id="game-over-screen" class="hidden">
    <div class="game-over-card glass-card">
      <div class="img-avatar-container">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" fill="#1e2634"/>
          <path d="M30 40 Q50 25 70 40" stroke="#ffaa2b" stroke-width="6" stroke-linecap="round"/>
          <circle cx="35" cy="48" r="6" fill="#ff4d4d"/>
          <circle cx="65" cy="48" r="6" fill="#ff4d4d"/>
          <path d="M32 70 Q50 82 68 70" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
          <path d="M20 25 L35 35 M80 25 L65 35" stroke="#ffaa2b" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="taunt-message" id="taunt-text">
        pfttt.. haha you lost to Ai ? why dont you try again ?
      </div>

      <div class="game-details-box">
        <div class="detail-row">
          <span>Game Mode:</span>
          <span id="detail-mode">Player vs AI</span>
        </div>
        <div class="detail-row" id="detail-diff-row">
          <span>Difficulty:</span>
          <span id="detail-diff">Intermediate</span>
        </div>
        <div class="detail-row">
          <span>Total Turns Played:</span>
          <span id="detail-turns">0</span>
        </div>
        <div class="detail-row">
          <span>Blocks Extracted:</span>
          <span id="detail-extracted">0</span>
        </div>
        <div class="detail-row">
          <span>Winning Player:</span>
          <span id="detail-winner" style="color: #38ef7d;">AI</span>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-action btn-menu" onclick="backToMenu()">Back to Menu</button>
        <button class="btn-action btn-rematch" onclick="rematchGame()">Rematch</button>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let world;
    let blockEntities = [];
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let hoveredMesh = null;

    let selectedMode = 'vs_ai';
    let selectedDiff = 'intermediate';
    let players = [];
    let currentPlayerIdx = 0;
    let lastMovedPlayerIdx = null;
    
    let isAnimating = false;
    let isGameOver = false;
    let gameStartTime = 0;
    let topLayerIndex = 18;
let topLayerSlot = 0;
    let totalTurnsCount = 0;
    let extractedBlocksCount = 0;

    let moveHistory = [];
    let pointerDownCoords = { x: 0, y: 0 };

    const BLOCK_W = 0.9;
    const BLOCK_H = 0.5;
    const BLOCK_L = 2.7;

    init();
    animate();

    function init() {
      const container = document.getElementById('webgl-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0c10);
      scene.fog = new THREE.FogExp2(0x0a0c10, 0.025);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(7, 10, 13);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 4;
      controls.maxDistance = 25;
      controls.minPolarAngle = 0; 
      controls.maxPolarAngle = Math.PI / 2 - 0.02;
      controls.target.set(0, 4.5, 0);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
      dirLight.position.set(8, 18, 10);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);

      const pointLight = new THREE.PointLight(0xff9d00, 0.5, 20);
      pointLight.position.set(-6, 8, -6);
      scene.add(pointLight);

      world = new CANNON.World();
      world.gravity.set(0, -9.81, 0);
      world.broadphase = new CANNON.NaiveBroadphase();
      world.solver.iterations = 50;

      const woodPhysicsMaterial = new CANNON.Material("wood");
      // Boosted friction to 4.5 so blocks grip strongly against each other
      const woodContact = new CANNON.ContactMaterial(woodPhysicsMaterial, woodPhysicsMaterial, {
        friction: 4.4,
        restitution: 0.0
      });
      world.addContactMaterial(woodContact);

      const groundShape = new CANNON.Plane();
      const groundBody = new CANNON.Body({ mass: 0, material: woodPhysicsMaterial });
      groundBody.addShape(groundShape);
      groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      world.addBody(groundBody);

      const tableGeo = new THREE.CylinderGeometry(7, 7, 0.4, 64);
      const tableMat = new THREE.MeshStandardMaterial({ color: 0x181410, roughness: 0.6 });
      const tableMesh = new THREE.Mesh(tableGeo, tableMat);
      tableMesh.position.y = -0.2;
      tableMesh.receiveShadow = true;
      scene.add(tableMesh);

      buildPhysicsTower(woodPhysicsMaterial);

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerdown', (e) => {
        pointerDownCoords = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener('pointerup', onPointerUp);
    }

    function createWoodTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#c88b4a';
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = 'rgba(110, 55, 15, 0.15)';
      for (let i = 0; i < 500; i++) {
        ctx.fillRect(Math.random() * 512, 0, Math.random() * 2 + 1, 512);
      }

      ctx.font = 'bold 36px Arial';
      ctx.fillStyle = 'rgba(70, 35, 10, 0.45)';
      ctx.textAlign = 'center';
      ctx.fillText('JENGA', 256, 270);

      return new THREE.CanvasTexture(canvas);
    }

    function buildPhysicsTower(woodMaterial) {
      blockEntities.forEach(e => {
        scene.remove(e.mesh);
        world.remove(e.body);
      });
      blockEntities = [];
      moveHistory = [];
      lastMovedPlayerIdx = null;

      const woodTexture = createWoodTexture();
      const meshMaterial = new THREE.MeshStandardMaterial({ map: woodTexture, roughness: 0.35 });
      const boxGeo = new THREE.BoxGeometry(BLOCK_W, BLOCK_H, BLOCK_L);
      const boxShape = new CANNON.Box(new CANNON.Vec3(BLOCK_W / 2, BLOCK_H / 2, BLOCK_L / 2));

      topLayerIndex = 18;
      topLayerSlot = 0;
      totalTurnsCount = 0;
      extractedBlocksCount = 0;
      isGameOver = false;

      for (let layer = 0; layer < 18; layer++) {
        const isEven = layer % 2 === 0;
        const y = layer * (BLOCK_H + 0.01) + BLOCK_H / 2;

        for (let i = -1; i <= 1; i++) {
          let x = 0, z = 0;
          let rotY = 0;

          if (isEven) {
            x = i * (BLOCK_W + 0.02);
          } else {
            z = i * (BLOCK_W + 0.02);
            rotY = Math.PI / 2;
          }

          const mesh = new THREE.Mesh(boxGeo, meshMaterial.clone());
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          scene.add(mesh);

          const body = new CANNON.Body({
            mass: 1.0,
            material: woodMaterial,
            shape: boxShape,
            linearDamping: 0.7,
            angularDamping: 0.9
          });
          body.position.set(x, y, z);
          body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), rotY);

          world.addBody(body);

          blockEntities.push({
            id: blockEntities.length,
            mesh: mesh,
            body: body,
            layer: layer,
            extracted: false,
            isEven: isEven
          });
        }
      }
    }

    function goToModeMenu() {
      document.getElementById('start-menu').classList.add('hidden');
      document.getElementById('mode-menu').classList.remove('hidden');
    }

    function selectMode(mode) {
      selectedMode = mode;
      document.getElementById('mode-menu').classList.add('hidden');

      if (mode === 'vs_ai') {
        document.getElementById('diff-menu').classList.remove('hidden');
      } else {
        startGame();
      }
    }

    function startGameWithDiff(diff) {
      selectedDiff = diff;
      document.getElementById('diff-menu').classList.add('hidden');
      startGame();
    }

    function startGame() {
      document.getElementById('start-menu').classList.add('hidden');
      document.getElementById('mode-menu').classList.add('hidden');
      document.getElementById('diff-menu').classList.add('hidden');
      document.getElementById('game-over-screen').classList.add('hidden');
      document.getElementById('game-hud').classList.remove('hidden');

      if (selectedMode === 'vs_ai') {
        players = [{ id: 1, name: 'Player 1', isAI: false }, { id: 2, name: 'AI', isAI: true }];
      } else if (selectedMode === '2p') {
        players = [{ id: 1, name: 'Player 1', isAI: false }, { id: 2, name: 'Player 2', isAI: false }];
      } else {
        players = [
          { id: 1, name: 'Player 1', isAI: false },
          { id: 2, name: 'Player 2', isAI: false },
          { id: 3, name: 'Player 3', isAI: false }
        ];
      }

      currentPlayerIdx = 0;
      lastMovedPlayerIdx = null;
      gameStartTime = Date.now();
      isAnimating = false;
      buildPhysicsTower(world.defaultContactMaterial);
      updateTurnUI();
    }

    function backToMenu() {
      document.getElementById('game-hud').classList.add('hidden');
      document.getElementById('game-over-screen').classList.add('hidden');
      document.getElementById('start-menu').classList.remove('hidden');
    }

    function rematchGame() {
      document.getElementById('game-over-screen').classList.add('hidden');
      startGame();
    }

    function updateTurnUI() {
      const current = players[currentPlayerIdx];
      const turnDisplay = document.getElementById('hud-turn-display');
      if (current.isAI) {
        turnDisplay.innerText = "🤖 AI Thinking...";
        turnDisplay.style.borderColor = "#ff4d4d";
      } else {
        turnDisplay.innerText = `🎮 ${current.name}'s Turn`;
        turnDisplay.style.borderColor = "#ff9d00";
      }
    }

    function saveState() {
      const snapshot = {
        topLayerIndex: topLayerIndex,
        topLayerSlot: topLayerSlot,
        currentPlayerIdx: currentPlayerIdx,
        lastMovedPlayerIdx: lastMovedPlayerIdx,
        totalTurnsCount: totalTurnsCount,
        extractedBlocksCount: extractedBlocksCount,
        blocks: blockEntities.map(e => ({
          pos: e.body.position.clone(),
          quat: e.body.quaternion.clone(),
          extracted: e.extracted,
          layer: e.layer
        }))
      };
      moveHistory.push(snapshot);
    }

    function undoMove() {
      if (moveHistory.length === 0 || isAnimating || isGameOver) return;

      let stepsToUndo = (selectedMode === 'vs_ai' && !players[currentPlayerIdx].isAI && moveHistory.length >= 2) ? 2 : 1;
      let targetState = null;

      for (let i = 0; i < stepsToUndo; i++) {
        if (moveHistory.length > 0) {
          targetState = moveHistory.pop();
        }
      }

      if (!targetState) return;

      topLayerIndex = targetState.topLayerIndex;
      topLayerSlot = targetState.topLayerSlot ?? 0;
      currentPlayerIdx = targetState.currentPlayerIdx;
      lastMovedPlayerIdx = targetState.lastMovedPlayerIdx;
      totalTurnsCount = targetState.totalTurnsCount;
      extractedBlocksCount = targetState.extractedBlocksCount;

      targetState.blocks.forEach((bState, idx) => {
        const entity = blockEntities[idx];
        entity.body.position.copy(bState.pos);
        entity.body.quaternion.copy(bState.quat);
        entity.body.velocity.set(0, 0, 0);
        entity.body.angularVelocity.set(0, 0, 0);
        entity.mesh.position.copy(bState.pos);
        entity.mesh.quaternion.copy(bState.quat);
        entity.extracted = bState.extracted;
        entity.layer = bState.layer;
      });

      isAnimating = false;
      updateTurnUI();
    }

    function onPointerMove(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      if (isAnimating || isGameOver || players[currentPlayerIdx]?.isAI) return;

      raycaster.setFromCamera(mouse, camera);
      const meshes = blockEntities.filter(e => !e.extracted).map(e => e.mesh);
      const intersects = raycaster.intersectObjects(meshes);

      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        if (hoveredMesh && hoveredMesh !== hitMesh) {
          hoveredMesh.material.emissive.setHex(0x000000);
        }
        hoveredMesh = hitMesh;
        hoveredMesh.material.emissive.setHex(0x0088ff);
      } else if (hoveredMesh) {
        hoveredMesh.material.emissive.setHex(0x000000);
        hoveredMesh = null;
      }
    }

    function onPointerUp(e) {
      if (isAnimating || isGameOver || players[currentPlayerIdx]?.isAI) return;

      const dist = Math.hypot(e.clientX - pointerDownCoords.x, e.clientY - pointerDownCoords.y);
      if (dist > 8) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const meshes = blockEntities.filter(e => !e.extracted).map(e => e.mesh);
      const intersects = raycaster.intersectObjects(meshes);

      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        const entity = blockEntities.find(e => e.mesh === hitMesh);
        if (entity && !entity.extracted) {
          if (hoveredMesh) {
            hoveredMesh.material.emissive.setHex(0x000000);
            hoveredMesh = null;
          }
          executeBlockMove(entity);
        }
      }
    }

    function executeBlockMove(entity) {
      if (!entity || entity.extracted || isGameOver) {
        isAnimating = false;
        return;
      }

      saveState();

      lastMovedPlayerIdx = currentPlayerIdx;

      isAnimating = true;
      entity.extracted = true;
      extractedBlocksCount++;
      totalTurnsCount++;

      const pullDir = entity.isEven ? new CANNON.Vec3(0, 0, 8.5) : new CANNON.Vec3(8.5, 0, 0);
      entity.body.velocity.copy(pullDir);

      setTimeout(() => {
        const topY =
          topLayerIndex * (BLOCK_H + 0.01) + BLOCK_H / 2;

        entity.body.velocity.set(0, 0, 0);
        entity.body.angularVelocity.set(0, 0, 0);

        // Place exactly 3 blocks side-by-side on each new top layer.
        // Alternate the layer direction by 90 degrees.
        const spacing = BLOCK_W + 0.02;

        let x = 0;
        let z = 0;

        if (topLayerIndex % 2 === 0) {
          // Horizontal layer: left, center, right.
          x = (topLayerSlot - 1) * spacing;
          z = 0;

          entity.body.quaternion.setFromAxisAngle(
            new CANNON.Vec3(0, 1, 0),
            0
          );
        } else {
          // Vertical layer: back, center, front.
          x = 0;
          z = (topLayerSlot - 1) * spacing;

          entity.body.quaternion.setFromAxisAngle(
            new CANNON.Vec3(0, 1, 0),
            Math.PI / 2
          );
        }

        entity.body.position.set(x, topY, z);
        entity.layer = topLayerIndex;

        topLayerSlot++;

        // A layer is complete only after all 3 blocks are placed.
        if (topLayerSlot >= 3) {
          topLayerSlot = 0;
          topLayerIndex++;
        }
        isAnimating = false;

        if (!isGameOver) {
          advanceTurn();
        }
      }, 750);
    }

    function advanceTurn() {
      currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
      updateTurnUI();

      if (players[currentPlayerIdx].isAI && !isGameOver) {
        setTimeout(processAITurn, 1000);
      }
    }

    // Evaluates the safety risk of removing a specific block from its layer
    function evaluateBlockSafety(entity) {
      const layerBlocks = blockEntities.filter(e => !e.extracted && e.layer === entity.layer);
      const count = layerBlocks.length;

      let posIndex = entity.isEven 
        ? Math.round(entity.body.position.x / (BLOCK_W + 0.02)) 
        : Math.round(entity.body.position.z / (BLOCK_W + 0.02));

      // Layer with 3 blocks is completely safe
      if (count === 3) return 'safe';

      // Layer with 2 blocks
      if (count === 2) {
        const hasCenter = layerBlocks.some(e => {
          let idx = e.isEven 
            ? Math.round(e.body.position.x / (BLOCK_W + 0.02)) 
            : Math.round(e.body.position.z / (BLOCK_W + 0.02));
          return idx === 0;
        });

        if (hasCenter) {
          // Pulling outer block leaves center (safe)
          if (posIndex !== 0) return 'safe';
          // Pulling center block leaves 1 off-center outer block (deadly)
          return 'deadly';
        } else {
          // Center is missing, 2 outers exist. Removing either leaves 1 off-center block (deadly)
          return 'deadly';
        }
      }

      // Single remaining block in a layer is deadly to remove
      return 'deadly';
    }

    function processAITurn() {
      if (isGameOver) return;

      // Only evaluate blocks below the top 2 active layers
      const candidateBlocks = blockEntities.filter(
        e => !e.extracted && e.layer < (topLayerIndex - 2)
      );

      if (candidateBlocks.length === 0) {
        isAnimating = false;
        advanceTurn();
        return;
      }

      const safePool = [];
      const deadlyPool = [];

      candidateBlocks.forEach(b => {
        const safety = evaluateBlockSafety(b);
        if (safety === 'safe') safePool.push(b);
        else deadlyPool.push(b);
      });

      let chosenEntity = null;
      const rand = Math.random();

      if (selectedDiff === 'easy') {
        // Easy AI: 35% chance to make a terrible/deadly move
        if (rand < 0.35 && deadlyPool.length > 0) {
          chosenEntity = deadlyPool[Math.floor(Math.random() * deadlyPool.length)];
        } else {
          chosenEntity = (safePool.length > 0 ? safePool : candidateBlocks)[Math.floor(Math.random() * (safePool.length || candidateBlocks.length))];
        }
      } else if (selectedDiff === 'intermediate') {
        // Intermediate AI: 5% chance to blunder into a deadly move
        if (rand < 0.05 && deadlyPool.length > 0) {
          chosenEntity = deadlyPool[Math.floor(Math.random() * deadlyPool.length)];
        } else {
          chosenEntity = (safePool.length > 0 ? safePool : candidateBlocks)[Math.floor(Math.random() * (safePool.length || candidateBlocks.length))];
        }
      } else if (selectedDiff === 'hard') {
        // Hard AI: Never picks deadly blocks unless no safe blocks exist
        if (safePool.length > 0) {
          chosenEntity = safePool[Math.floor(Math.random() * safePool.length)];
        } else {
          chosenEntity = deadlyPool[Math.floor(Math.random() * deadlyPool.length)];
        }
      } else {
        // Impossible AI: Perfect choices + prioritizes removing center blocks to weaken structure for human player
        const safeCenters = safePool.filter(e => {
          let idx = e.isEven ? Math.round(e.body.position.x / (BLOCK_W + 0.02)) : Math.round(e.body.position.z / (BLOCK_W + 0.02));
          return idx === 0;
        });

        if (safeCenters.length > 0) {
          chosenEntity = safeCenters[0];
        } else if (safePool.length > 0) {
          chosenEntity = safePool[0];
        } else {
          chosenEntity = candidateBlocks[0];
        }
      }

      if (chosenEntity) {
        executeBlockMove(chosenEntity);
      } else {
        isAnimating = false;
        advanceTurn();
      }
    }

    function checkTowerCollapse() {
      if (isGameOver || Date.now() - gameStartTime < 1500) return;

      for (let entity of blockEntities) {
        const pos = entity.body.position;
        const rot = entity.body.quaternion;

        const upVector = new CANNON.Vec3(0, 1, 0);
        const blockUp = rot.vmult(new CANNON.Vec3(0, 1, 0));
        const dot = upVector.dot(blockUp);

        if (pos.y < 0.1 || (dot < 0.45 && pos.y > 0.4)) {
          triggerGameOver();
          break;
        }
      }
    }

    function triggerGameOver() {
      isGameOver = true;
      document.getElementById('game-hud').classList.add('hidden');

      const loserIdx = (lastMovedPlayerIdx !== null) ? lastMovedPlayerIdx : currentPlayerIdx;
      const loserPlayer = players[loserIdx];
      let winningPlayer;
      let tauntMsg = "";

      if (selectedMode === 'vs_ai') {
        if (loserPlayer.isAI) {
          winningPlayer = players.find(p => !p.isAI);
          tauntMsg = "🎉 YOU WIN! The AI knocked over the tower!";
        } else {
          winningPlayer = players.find(p => p.isAI);
          tauntMsg = "pfttt.. haha you lost to Ai ? why dont you try again ?";
        }
      } else if (selectedMode === '2p') {
        winningPlayer = players.find(p => p.id !== loserPlayer.id);
        tauntMsg = `pfttt.. haha player ${loserPlayer.id} knocked it over! Player ${winningPlayer.id} wins!`;
      } else {
        winningPlayer = players.find(p => p.id !== loserPlayer.id);
        tauntMsg = `pfttt.. haha player ${loserPlayer.id} knocked it over! Player ${winningPlayer.id} wins!`;
      }

      document.getElementById('taunt-text').innerText = tauntMsg;
      document.getElementById('detail-mode').innerText = selectedMode === 'vs_ai' ? 'Player vs AI' : (selectedMode === '2p' ? '2 Players' : '3 Players');
      
      const diffRow = document.getElementById('detail-diff-row');
      if (selectedMode === 'vs_ai') {
        diffRow.style.display = 'flex';
        document.getElementById('detail-diff').innerText = selectedDiff.toUpperCase();
      } else {
        diffRow.style.display = 'none';
      }

      document.getElementById('detail-turns').innerText = totalTurnsCount;
      document.getElementById('detail-extracted').innerText = extractedBlocksCount;
      document.getElementById('detail-winner').innerText = winningPlayer.name;

      document.getElementById('game-over-screen').classList.remove('hidden');
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      world.step(1 / 60);

      for (let entity of blockEntities) {
        entity.mesh.position.copy(entity.body.position);
        entity.mesh.quaternion.copy(entity.body.quaternion);
      }

      checkTowerCollapse();
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
